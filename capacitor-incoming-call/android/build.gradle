ext {
    onesignalVersion = project.hasProperty('onesignalVersion') ? rootProject.ext.onesignalVersion : '[5.1.0, 5.99.99]'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.cryptvora.incomingcall"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35

    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 23
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"
    // Same SDK the app already pulls in via @onesignal/capacitor-plugin —
    // this module only compiles against its public interfaces
    // (INotificationServiceExtension etc.), it doesn't add a second copy.
    compileOnly "com.onesignal:OneSignal:$onesignalVersion"
}
