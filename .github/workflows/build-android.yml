name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Add Android platform (first run only)
        run: test -d android || npx cap add android

      - name: Grant camera/microphone permissions (needed for real voice/video calls)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST" || \
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.READ_CONTACTS" />\n    <uses-permission android:name="android.permission.WRITE_CONTACTS" />\n</manifest>#' "$MANIFEST"
          cat "$MANIFEST"

      - name: Add "hoox://" deep-link scheme (needed for the Google Sign-In redirect back into the app)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="hoox"' "$MANIFEST" || \
            python3 - "$MANIFEST" << 'PYEOF'
          import re, sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()
          intent_filter = (
              '        <intent-filter>\n'
              '            <action android:name="android.intent.action.VIEW" />\n'
              '            <category android:name="android.intent.category.DEFAULT" />\n'
              '            <category android:name="android.intent.category.BROWSABLE" />\n'
              '            <data android:scheme="hoox" android:host="login-callback" />\n'
              '        </intent-filter>\n'
              '    </activity>'
          )
          # Insert just before the closing </activity> of the MAIN launcher activity
          # (the one with the MAIN/LAUNCHER intent-filter), leaving any other
          # <activity> blocks (e.g. the native incoming-call screen) untouched.
          pattern = re.compile(
              r'(<activity[^>]*>(?:(?!</activity>).)*?android\.intent\.action\.MAIN(?:(?!</activity>).)*?)</activity>',
              re.DOTALL,
          )
          new_content, count = pattern.subn(lambda m: m.group(1) + intent_filter, content, count=1)
          if count == 0:
              print("::warning::Couldn't find the MAIN activity to attach the hoox:// deep link to — Google Sign-In redirect won't work.")
          else:
              with open(path, "w") as f:
                  f.write(new_content)
          PYEOF
          cat "$MANIFEST"

      - name: Generate app icon from resources/icon.png
        run: npx capacitor-assets generate --android

      - name: Use fixed debug keystore (so updates install without uninstalling)
        run: |
          mkdir -p ~/.android
          base64 -d android-keystore/debug.keystore.b64 > ~/.android/debug.keystore

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cryptvora-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
