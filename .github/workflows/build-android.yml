name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: npm run build

      - name: Add Android platform (first run only)
        run: test -d android || npx cap add android

      - name: Add Firebase config (google-services.json) for Google Sign-In, if provided
        run: |
          if [ -f android-keystore/google-services.json.b64 ]; then
            base64 -d android-keystore/google-services.json.b64 > android/app/google-services.json
            echo "HAS_GOOGLE_SERVICES=true" >> "$GITHUB_ENV"
          else
            echo "::warning::android-keystore/google-services.json.b64 not found — building without native Google Sign-In. See CALL_FIX_README_AR.md."
            echo "HAS_GOOGLE_SERVICES=false" >> "$GITHUB_ENV"
          fi

      - name: Apply Google Services Gradle plugin (only when google-services.json is present)
        if: env.HAS_GOOGLE_SERVICES == 'true'
        run: |
          PROJECT_GRADLE=android/build.gradle
          grep -q 'com.google.gms:google-services' "$PROJECT_GRADLE" || \
            sed -i "0,/dependencies {/s//dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'/" "$PROJECT_GRADLE"
          APP_GRADLE=android/app/build.gradle
          grep -q "com.google.gms.google-services" "$APP_GRADLE" || \
            echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"

      - name: Grant camera/microphone permissions (needed for real voice/video calls)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST" || \
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$MANIFEST"
          cat "$MANIFEST"

      - name: Generate app icon from resources/icon.png
        run: npx capacitor-assets generate --android

      - name: Use fixed debug keystore (so updates install without uninstalling)
        run: |
          mkdir -p ~/.android
          base64 -d android-keystore/debug.keystore.b64 > ~/.android/debug.keystore

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cryptvora-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
